name: One-time HomeFlow 2-hour bill reminder production release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-bill-two-hour-release-20261119.yml
permissions:
  contents: read
concurrency:
  group: homeflow-production-two-hour-bill-reminders
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require audited merge, existing production config and deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "9c768e71c56de928e9c35003970c78fe6599f0a0"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          grep -F 'preview_urls = false' wrangler.toml
          grep -F 'crons = ["0 * * * *"]' wrangler.toml
          grep -F 'service = "kakeibo-homeflow-bridge"' wrangler.toml
      - uses: actions/checkout@v5
        with:
          repository: PTamako/kakebo_jp
          ref: main
          path: .contract-kakeibo
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: PTamako/jp-document-assistant
          ref: main
          path: .contract-document
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Stamp production assets for this release
        run: node scripts/stamp-pwa.mjs "$GITHUB_SHA"
      - name: Verify 6–22 JST two-hour cadence and full accessible regression suite
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t suites < <(find tests -maxdepth 1 -name '*.test.mjs' ! -name 'document-study-three-real-apps.test.mjs' | sort)
          KAKEBO_CONTRACT_ROOT="$GITHUB_WORKSPACE/.contract-kakeibo" node --test --test-skip-pattern="G0 cross-app CI can locate every Stage F migration in its pinned checkout" "${suites[@]}"
      - name: Typechecked production Vue build
        run: npm run build
      - name: Synthetic local migrations and rollback safety
        run: |
          python3 scripts/check_migrations.py
          python3 -m unittest discover -s tests -p 'test_release_local_data_rehearsal.py'
      - name: Preflight Cloudflare production bindings
        run: node scripts/release-g8-binding-preflight.mjs
      - name: Worker dry-run
        run: npx wrangler deploy --dry-run --outdir .wrangler/two-hour-release-dryrun
      - name: Check existing production health before publish
        run: |
          curl --retry 3 --retry-delay 2 --fail --silent --show-error https://homeflow.yupan6706.workers.dev/api/health | python3 -c "import json,sys;d=json.load(sys.stdin);assert d.get('ok') and d.get('environment')=='production' and d.get('database')=='ready',d"
      - name: Deploy ONLY existing HomeFlow Worker (no Preview or D1 migrations)
        run: npx wrangler deploy
      - name: Check new production health
        run: |
          curl --retry 4 --retry-delay 2 --fail --silent --show-error https://homeflow.yupan6706.workers.dev/api/health | python3 -c "import json,sys;d=json.load(sys.stdin);assert d.get('ok') and d.get('environment')=='production' and d.get('database')=='ready',d"
