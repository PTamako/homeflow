name: One-time HomeFlow Cloudflare two-hour Cron production release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-bihourly-cloudflare-cron-release-20261119.yml
permissions:
  contents: read
concurrency:
  group: homeflow-production-cron-release-20261119
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate reviewed commit and UTC two-hour Cron configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ed9f985caec3d70a249aff8516a22f95d8576f31"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          grep -F 'preview_urls = false' wrangler.toml
          grep -F 'crons = ["0 1-23/2 * * *"]' wrangler.toml
          grep -F 'service = "kakeibo-homeflow-bridge"' wrangler.toml
      - uses: actions/checkout@v5
        with:
          repository: PTamako/kakebo_jp
          ref: main
          path: .contract-kakeibo
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: PTamako/jp-document-assistant
          ref: main
          path: .contract-document
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Stamp installed PWA shell with current release commit
        run: node scripts/stamp-pwa.mjs "$GITHUB_SHA"
      - name: Run all accessible production regression tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t suites < <(find tests -maxdepth 1 -name '*.test.mjs' ! -name 'document-study-three-real-apps.test.mjs' | sort)
          KAKEBO_CONTRACT_ROOT="$GITHUB_WORKSPACE/.contract-kakeibo" node --test --test-skip-pattern="G0 cross-app CI can locate every Stage F migration in its pinned checkout" "${suites[@]}"
      - name: Typecheck and build production Vue
        run: npm run build
      - name: Verify D1 migrations in local sandbox only
        run: |
          python3 scripts/check_migrations.py
          python3 -m unittest discover -s tests -p 'test_release_local_data_rehearsal.py'
      - name: Check production Service Bindings without mutation
        run: node scripts/release-g8-binding-preflight.mjs
      - name: Verify Worker and Cron bundle (no deploy)
        run: npx wrangler deploy --dry-run --outdir .wrangler/bihourly-production-dryrun
      - name: Require existing production healthy before deploying
        run: |
          curl --retry 3 --retry-delay 2 --fail --silent --show-error https://homeflow.yupan6706.workers.dev/api/health | python3 -c "import json,sys;d=json.load(sys.stdin);assert d.get('ok') and d.get('environment')=='production' and d.get('database')=='ready',d"
      - name: Deploy HomeFlow Worker and actual two-hour Cloudflare Cron
        run: npx wrangler deploy
      - name: Confirm live HomeFlow production health
        run: |
          curl --retry 4 --retry-delay 2 --fail --silent --show-error https://homeflow.yupan6706.workers.dev/api/health | python3 -c "import json,sys;d=json.load(sys.stdin);assert d.get('ok') and d.get('environment')=='production' and d.get('database')=='ready',d"
