name: One-time HomeFlow owner-scoped bill confirmation production release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-bill-confirmation-release-20261119.yml
permissions:
  contents: read
concurrency:
  group: homeflow-production-bill-confirmation-release
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fail closed on wrong source, credentials, Preview or database migration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "db1abd4c95a3302ebfc94dbb8b22904686f6d00f"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          grep -F 'preview_urls = false' wrangler.toml
          grep -F 'service = "kakeibo-homeflow-bridge"' wrangler.toml
      - uses: actions/checkout@v5
        with:
          repository: PTamako/kakebo_jp
          ref: main
          path: .contract-kakeibo
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: PTamako/jp-document-assistant
          ref: main
          path: .contract-document
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Stamp installed PWA assets
        run: node scripts/stamp-pwa.mjs "$GITHUB_SHA"
      - name: All HomeFlow and accessible cross-app tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t suites < <(find tests -maxdepth 1 -name '*.test.mjs' ! -name 'document-study-three-real-apps.test.mjs' | sort)
          KAKEBO_CONTRACT_ROOT="$GITHUB_WORKSPACE/.contract-kakeibo" node --test --test-skip-pattern="G0 cross-app CI can locate every Stage F migration in its pinned checkout" "${suites[@]}"
      - name: Typecheck production Vue and build
        run: npm run build
      - name: Validate production D1 migration inventory without modifying D1
        run: |
          python3 scripts/check_migrations.py
          python3 -m unittest discover -s tests -p 'test_release_local_data_rehearsal.py'
      - name: Read-only Cloudflare G8 bindings check
        run: node scripts/release-g8-binding-preflight.mjs
      - name: Worker dry-run
        run: npx wrangler deploy --dry-run --outdir .wrangler/bill-notification-dryrun
      - name: Existing production health must succeed before release
        run: |
          curl --retry 3 --retry-delay 2 --fail --silent --show-error https://homeflow.yupan6706.workers.dev/api/health | python3 -c "import json,sys;d=json.load(sys.stdin);assert d.get('ok') and d.get('environment')=='production' and d.get('database')=='ready',d"
      - name: Deploy HomeFlow Worker only (no Preview, no migrations, no Kakeibo Pages)
        run: npx wrangler deploy
      - name: Verify live HomeFlow production D1 and API
        run: |
          curl --retry 4 --retry-delay 2 --fail --silent --show-error https://homeflow.yupan6706.workers.dev/api/health | python3 -c "import json,sys;d=json.load(sys.stdin);assert d.get('ok') and d.get('environment')=='production' and d.get('database')=='ready',d"
