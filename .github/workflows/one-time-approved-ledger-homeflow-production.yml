name: One-time Approved Household Ledger HomeFlow Production Publish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-approved-ledger-homeflow-production.yml'
permissions:
  contents: read
concurrency:
  group: deploy-homeflow-production
  cancel-in-progress: false
jobs:
  production:
    if: "${{ startsWith(github.event.head_commit.message, 'deploy(homeflow): publish approved shared-ledger release') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Require production credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Cloudflare production token unavailable"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Cloudflare account unavailable"; exit 1; }
      - name: Checkout exact released Kakeibo contract
        uses: actions/checkout@v4
        with:
          repository: PTamako/kakebo_jp
          ref: 465a909abebf9a33ed256dd36b1cfe409ae759bf
          path: .contract-kakeibo
          persist-credentials: false
      - name: Checkout reviewed Document Assistant
        uses: actions/checkout@v4
        with:
          repository: PTamako/jp-document-assistant
          ref: 3289c5ffa8dc472d0bba399ad9672a5bc96c504c
          path: .contract-document
          persist-credentials: false
      - name: Checkout reviewed Study
        uses: actions/checkout@v4
        with:
          repository: PTamako/it-study-platform
          ref: dea0a9607a2cde2b66f328696954750748f67f42
          path: .contract-study
          persist-credentials: false
      - name: Reject drifted linked production repositories
        shell: bash
        run: |
          set -euo pipefail
          while read -r repo pinned; do
            latest="$(git ls-remote "https://github.com/PTamako/${repo}.git" refs/heads/main | cut -f1)"
            test -n "$latest" && test "$latest" = "$pinned" || { echo "::error::stale reviewed contract: $repo"; exit 1; }
          done <<'REVIEWED_HEADS'
          kakebo_jp 465a909abebf9a33ed256dd36b1cfe409ae759bf
          jp-document-assistant 3289c5ffa8dc472d0bba399ad9672a5bc96c504c
          it-study-platform dea0a9607a2cde2b66f328696954750748f67f42
          REVIEWED_HEADS
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Stamp production PWA cache
        run: node scripts/stamp-pwa.mjs "$GITHUB_SHA"
      - name: Complete cross-app tests and typechecked bundle
        env:
          KAKEBO_CONTRACT_ROOT: ${{ github.workspace }}/.contract-kakeibo
        run: npm run check
      - name: Confirm migration manifest without changing D1
        run: python3 scripts/check_migrations.py
      - name: Read-only live G8 binding and secret inventory
        run: node scripts/release-g8-binding-preflight.mjs
      - name: Deploy only existing HomeFlow production Worker
        run: npx wrangler deploy
      - name: Confirm production identity and database health
        run: |
          curl --retry 5 --retry-delay 3 --fail --silent --show-error https://homeflow.yupan6706.workers.dev/api/health | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('ok') and d.get('environment')=='production' and d.get('database')=='ready',d"
