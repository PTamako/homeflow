name: One-time HomeFlow audited production release 2026-11-19
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/homeflow-production-audit-release-20261119.yml

permissions:
  contents: read
concurrency:
  group: homeflow-production-audited-release
  cancel-in-progress: false

jobs:
  release-homeflow-only:
    if: github.repository == 'PTamako/homeflow'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require reviewed HomeFlow-only merge and deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "26a7d298493d737e9b0f53258bd37975561a184b" HEAD
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test ! -f .github/workflows/four-app-production-release.yml
          test ! -f .github/workflows/four-app-resume-staged-release.yml
          test ! -f .github/workflows/four-app-finalize-production.yml
          test ! -f .github/workflows/study-homeflow-hotfix.yml
          grep -F 'preview_urls = false' wrangler.toml
      - name: Checkout Kakeibo contract counterpart
        uses: actions/checkout@v5
        with:
          repository: PTamako/kakebo_jp
          ref: main
          path: .contract-kakeibo
          persist-credentials: false
      - name: Checkout Document Assistant contract counterpart
        uses: actions/checkout@v5
        with:
          repository: PTamako/jp-document-assistant
          ref: main
          path: .contract-document
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Version PWA static assets for this exact release commit
        run: node scripts/stamp-pwa.mjs "$GITHUB_SHA"
      - name: Run HomeFlow and public cross-app regression tests
        shell: bash
        env:
          KAKEBO_CONTRACT_ROOT: ${{ github.workspace }}/.contract-kakeibo
        run: |
          set -euo pipefail
          mapfile -t suites < <(find tests -maxdepth 1 -name '*.test.mjs' ! -name 'document-study-three-real-apps.test.mjs' | sort)
          node --test --test-skip-pattern="G0 cross-app CI can locate every Stage F migration in its pinned checkout" "${suites[@]}"
      - name: Typecheck and build production frontend
        run: npm run build
      - name: Validate every local migration and isolated rollback rehearsal
        run: |
          python3 scripts/check_migrations.py
          python3 -m unittest discover -s tests -p 'test_release_local_data_rehearsal.py'
      - name: Read-only verify Cloudflare production bindings and service graph
        run: node scripts/release-g8-binding-preflight.mjs
      - name: Verify Worker bundle without deployment
        run: npx wrangler deploy --dry-run --outdir .wrangler/dryrun
      - name: Require currently healthy HomeFlow before publishing
        run: |
          curl --retry 3 --retry-delay 2 --fail --silent --show-error https://homeflow.yupan6706.workers.dev/api/health | python3 -c "import sys,json;d=json.load(sys.stdin);assert d.get('ok') and d.get('environment')=='production' and d.get('database')=='ready',d"
      - name: Deploy ONLY HomeFlow production Worker (no migrations, no Preview)
        run: npx wrangler deploy
      - name: Verify deployed HomeFlow production health
        run: |
          curl --retry 4 --retry-delay 2 --fail --silent --show-error https://homeflow.yupan6706.workers.dev/api/health | python3 -c "import sys,json;d=json.load(sys.stdin);assert d.get('ok') and d.get('environment')=='production' and d.get('database')=='ready',d"
