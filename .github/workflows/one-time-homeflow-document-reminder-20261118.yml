name: One-time HomeFlow and Document reminder-only production release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-homeflow-document-reminder-20261118.yml'
permissions:
  contents: read
concurrency:
  group: four-app-coordinated-production-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DOCUMENT_SHA: 70b96960485327b063d843d2b9d96894c5491368
      CI: 'true'
    steps:
      - name: Checkout reviewed HomeFlow main
        uses: actions/checkout@v5
        with:
          repository: PTamako/homeflow
          ref: ${{ github.sha }}
          path: homeflow-src
          persist-credentials: false
      - name: Checkout reviewed Document Assistant main
        uses: actions/checkout@v5
        with:
          repository: PTamako/jp-document-assistant
          ref: 70b96960485327b063d843d2b9d96894c5491368
          path: document-src
          persist-credentials: false
      - name: Refuse stale main, missing credentials, Preview resources or mismatched contracts
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$(git -C homeflow-src rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C document-src rev-parse HEAD)" = "$DOCUMENT_SHA"
          live_hf="$(git ls-remote https://github.com/PTamako/homeflow.git refs/heads/main | cut -f1)"
          live_doc="$(git ls-remote https://github.com/PTamako/jp-document-assistant.git refs/heads/main | cut -f1)"
          test "$live_hf" = "$GITHUB_SHA"
          test "$live_doc" = "$DOCUMENT_SHA"
          grep -Fq 'preview_urls = false' homeflow-src/wrangler.toml
          grep -Fq '"preview_urls": false' document-src/wrangler.jsonc
          grep -Fq 'remindEnabled:p.remindEnabled,reminderOnly,clientRequestId:id' homeflow-src/worker/document-assistant-bridge.js
          grep -Fq 'reminderOnly};' document-src/worker/bridge.js
          grep -Fq 'candidateDraft.reminder_only' document-src/web/src/App.vue
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test and build HomeFlow production-only source
        working-directory: homeflow-src
        run: |
          npm ci --no-audit --no-fund
          node --test tests/document-assistant-bridge.test.mjs tests/reminder-only-no-points.test.mjs tests/auth-session-30day.test.mjs
          python3 scripts/check_migrations.py
          node scripts/stamp-pwa.mjs "$GITHUB_SHA"
          npm run build
          node --input-type=module -e "import {writeFileSync} from 'node:fs'; writeFileSync('dist/integration-release.json', JSON.stringify({app:'homeflow',sha:process.env.GITHUB_SHA,document:process.env.DOCUMENT_SHA}))"
      - name: Deploy existing HomeFlow PRODUCTION Worker first
        working-directory: homeflow-src
        run: npx wrangler deploy --config wrangler.toml
      - name: Test and build Document Assistant production-only source
        working-directory: document-src
        run: |
          npm ci --no-audit --no-fund
          npm run check:syntax
          node --test tests/document-task-reminder-bridge.test.js tests/document-audit-sync.test.js tests/document-production-hardening.test.js tests/homeflow-sso.test.js tests/document-auth-loss-ui.test.js
          npm run build
          node --input-type=module -e "import {writeFileSync} from 'node:fs'; writeFileSync('dist/integration-release.json', JSON.stringify({app:'document-assistant',sha:process.env.DOCUMENT_SHA,homeflow:process.env.GITHUB_SHA}))"
      - name: Deploy existing Document Assistant PRODUCTION Worker second
        working-directory: document-src
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Attest deployed SHAs and unsigned-auth rejection without personal writes
        env:
          HOMEFLOW_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          const apps=[
            ['homeflow','https://homeflow.yupan6706.workers.dev',process.env.HOMEFLOW_SHA,'document',process.env.DOCUMENT_SHA],
            ['document-assistant','https://jp-document-assistant.yupan6706.workers.dev',process.env.DOCUMENT_SHA,'homeflow',process.env.HOMEFLOW_SHA]
          ]
          for(const [app,base,sha,peer,peerSha] of apps){
            const response=await fetch(base+'/integration-release.json?release='+sha,{cache:'no-store',redirect:'manual'})
            assert.equal(response.status,200,app+' marker not deployed')
            assert.match(response.headers.get('content-type')||'',/application\/json/,app+' marker content-type')
            const marker=await response.json()
            assert.equal(marker.app,app)
            assert.equal(marker.sha,sha,app+' stale deployed source')
            assert.equal(marker[peer],peerSha,app+' peer source mismatch')
            const health=await fetch(base+'/api/health',{cache:'no-store'})
            assert.equal(health.status,200,app+' health')
            assert.equal((await health.json()).ok,true,app+' unhealthy')
          }
          const hf='https://homeflow.yupan6706.workers.dev'
          const da='https://jp-document-assistant.yupan6706.workers.dev'
          assert.equal((await fetch(hf+'/api/auth/me',{cache:'no-store'})).status,401)
          assert.equal((await fetch(da+'/api/me',{cache:'no-store'})).status,401)
          const malformed=await fetch(hf+'/api/bridge/document-assistant',{method:'POST',
            headers:{'Content-Type':'application/json'},body:'{}'})
          assert.equal(malformed.status,401,'unsigned bridge must refuse without writing')
          const status=await fetch(da+'/api/homeflow-sso/status',{cache:'no-store'})
          assert.equal(status.status,200)
          assert.equal((await status.json()).enabled,true)
          console.log('Both production SHAs matched; health and SSO verified; unsigned bridge denied. No D1 writes or Preview resources.')
          NODE
