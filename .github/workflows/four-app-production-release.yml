name: Four-app coordinated production release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/four-app-production-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: four-app-coordinated-production-release
  cancel-in-progress: false

jobs:
  live-release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CI: "true"
    steps:
      - name: Checkout HomeFlow production source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout Kakeibo production source
        uses: actions/checkout@v4
        with:
          repository: PTamako/kakebo_jp
          ref: main
          path: .contract-kakeibo
          persist-credentials: false
      - name: Checkout Study production source
        uses: actions/checkout@v4
        with:
          repository: PTamako/it-study-platform
          ref: main
          path: .contract-study
          persist-credentials: false
      - name: Checkout Document Assistant production source
        uses: actions/checkout@v4
        with:
          repository: PTamako/jp-document-assistant
          ref: main
          path: .contract-document
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ensure bound account credentials exist
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "Cloudflare release account credentials present (values not logged)"
      - name: Install and validate all four merged applications
        run: |
          npm ci --no-audit --no-fund
          npm run check
          (cd .contract-kakeibo && npm ci --no-audit --no-fund && npm run build)
          (cd .contract-study && npm ci --no-audit --no-fund && npm test && npm run build)
          (cd .contract-document && npm ci --no-audit --no-fund && npm test && npm run build)
          node scripts/release-g8-source-plan.mjs
          python3 scripts/check_migrations.py
      - name: Verify current real four-D1 snapshot and immutable local rollback
        run: node scripts/release-current-production-rehearsal.mjs
      - name: Generate synchronized production keys on disposable runner
        run: node scripts/four-app-release-secrets.mjs
      - name: Set paired Pages production variables without deploying it
        run: node scripts/four-app-release-configure-pages.mjs
      - name: Stage HomeFlow Worker version with paired secrets (no traffic)
        run: npx wrangler versions upload --secrets-file "$RUNNER_TEMP/four-app-release-keys/H.json"
      - name: Stage private Kakeibo finance Worker version (no traffic)
        run: |
          cd .contract-kakeibo
          GITHUB_SHA=$(git rev-parse HEAD) npx wrangler versions upload --config wrangler.homeflow-bridge.toml --secrets-file "$RUNNER_TEMP/four-app-release-keys/B.json"
      - name: Stage Study Worker version (no traffic)
        run: |
          cd .contract-study
          GITHUB_SHA=$(git rev-parse HEAD) npx wrangler versions upload --secrets-file "$RUNNER_TEMP/four-app-release-keys/S.json"
      - name: Stage Document Assistant Worker version (no traffic)
        run: |
          cd .contract-document
          GITHUB_SHA=$(git rev-parse HEAD) npx wrangler versions upload --secrets-file "$RUNNER_TEMP/four-app-release-keys/D.json"
      - name: Verify exact five-service staged G8 config (no traffic)
        run: node scripts/four-app-release-check-staged.mjs
      - name: Apply reviewed Stage F migrations to four production D1
        run: node scripts/four-app-release-apply-migrations.mjs
      - name: Activate all four Workers and Kakeibo Pages with rollback on failure
        run: node scripts/four-app-release-activate.mjs
      - name: Remove plaintext secret files from disposable runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/four-app-release-keys" || true
