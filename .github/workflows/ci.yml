name: Validate HomeFlow
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Checkout current Kakeibo contract
        uses: actions/checkout@v5
        with:
          repository: PTamako/kakebo_jp
          ref: main
          path: .contract-kakeibo
          persist-credentials: false
      - name: Checkout current Document Assistant contract
        uses: actions/checkout@v5
        with:
          repository: PTamako/jp-document-assistant
          ref: main
          path: .contract-document
          persist-credentials: false
      - name: Checkout current Study contract
        uses: actions/checkout@v5
        with:
          repository: PTamako/it-study-platform
          ref: main
          path: .contract-study
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Run complete HomeFlow and real four-app contract regressions
        env:
          KAKEBO_CONTRACT_ROOT: ${{ github.workspace }}/.contract-kakeibo
        run: npm run check
      - name: Verify full cross-app production source contracts
        run: node scripts/release-g8-source-plan.mjs
      - name: Verify migration manifest and isolated rollback
        run: |
          python3 scripts/check_migrations.py
          python3 -m unittest discover -s tests -p 'test_release_local_data_rehearsal.py'
          python3 -m unittest discover -s tests -p 'test_current_production_snapshots.py'
      - name: Verify Worker dry-run bundle without deploying
        run: npx wrangler deploy --dry-run --outdir .wrangler/scoped-core-ci
