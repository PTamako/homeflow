name: Validate HomeFlow
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reviewed contract counterpart. Update the pinned commit with the
      # cross-app contract whenever the target execution protocol changes.
      - name: Checkout Kakeibo contract counterpart
        uses: actions/checkout@v4
        with:
          repository: PTamako/kakebo_jp
          ref: d8081292a6b5d0228cc8cfdfa776c3ab3c92cdcc
          path: .contract-kakeibo
          persist-credentials: false
      - name: Checkout Document Assistant execution counterpart
        uses: actions/checkout@v4
        with:
          repository: PTamako/jp-document-assistant
          ref: 1fa0f8b2d952f6c3fb09bb5a017cdcc6990cf57e
          path: .contract-document
          persist-credentials: false
      - name: Checkout Study execution counterpart (immutable reviewed SHA)
        uses: actions/checkout@v4
        with:
          repository: PTamako/it-study-platform
          ref: b7bb8755220b0b0b706f5f042520a7dae483aaa4
          path: .contract-study
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests and typechecked build
        env:
          KAKEBO_CONTRACT_ROOT: ${{ github.workspace }}/.contract-kakeibo
        run: npm run check
      - name: Validate exact pre-deployment OAuth redirects, D1/R2 IDs and five-service binding graph
        run: node scripts/release-g8-source-plan.mjs
      - name: Verify D1 migrations and schema
        run: python3 scripts/check_migrations.py
      - name: Exercise fail-closed isolated SQLite data migrations and rollback (synthetic only)
        run: python3 -m unittest discover -s tests -p 'test_release_local_data_rehearsal.py'
      - name: Verify Worker bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler/dryrun
