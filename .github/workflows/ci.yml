name: Validate HomeFlow
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reviewed contract counterpart. Update the pinned commit with the
      # cross-app contract whenever the target execution protocol changes.
      - name: Checkout Kakeibo contract counterpart
        uses: actions/checkout@v4
        with:
          repository: PTamako/kakebo_jp
          ref: 900fb17c3bbc68f24c18466da321e85c496b4ea7
          path: .contract-kakeibo
          persist-credentials: false
      - name: Checkout Document Assistant execution counterpart
        uses: actions/checkout@v4
        with:
          repository: PTamako/jp-document-assistant
          ref: dcfaa5f714c222d69985f1038341f0bde56c6de9
          path: .contract-document
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests and typechecked build
        env:
          KAKEBO_CONTRACT_ROOT: ${{ github.workspace }}/.contract-kakeibo
        run: npm run check
      - name: Verify D1 migrations and schema
        run: python3 scripts/check_migrations.py
      - name: Verify Worker bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler/dryrun
