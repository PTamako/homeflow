name: One-time cloud-first iPhone storage production release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-cloud-first-storage-production-20261118.yml'
permissions:
  contents: read
concurrency:
  group: one-time-cloud-first-storage-20261118
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require existing Cloudflare production credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Checkout verified HomeFlow source
        uses: actions/checkout@v4
        with:
          ref: 8bbbf9e37cb642f530004bc42ff82ba529ce1f40
          persist-credentials: false
      - name: Checkout verified Kakeibo source
        uses: actions/checkout@v4
        with:
          repository: PTamako/kakebo_jp
          ref: ed9ac21d1d6c2b2e749e35211efbb3e469957677
          path: .contract-kakeibo
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify source heads have not moved since approval
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/PTamako/kakebo_jp.git refs/heads/main | cut -f1)" = "ed9ac21d1d6c2b2e749e35211efbb3e469957677"
      - name: Test reviewed HomeFlow and Kakeibo code before production deploy
        env:
          KAKEBO_CONTRACT_ROOT: ${{ github.workspace }}/.contract-kakeibo
        run: |
          npm ci --no-audit --no-fund
          npm run check
          (cd .contract-kakeibo && npm ci --no-audit --no-fund && npm run verify:release)
      - name: Deploy only existing HomeFlow production Worker and static assets
        run: npx wrangler deploy
      - name: Deploy only existing Kakeibo production Pages
        working-directory: .contract-kakeibo
        run: npx wrangler pages deploy dist --project-name=kakeibo --branch=main --commit-hash=ed9ac21d1d6c2b2e749e35211efbb3e469957677 --commit-message="verified cloud-first device cache release"
      - name: Verify both public production origins respond
        run: |
          set -euo pipefail
          curl --retry 3 --retry-delay 2 --fail --silent --show-error https://homeflow.yupan6706.workers.dev/api/health > /tmp/homeflow-health.json
          python3 -c "import json; d=json.load(open('/tmp/homeflow-health.json')); assert d.get('ok') is True, d"
          curl --retry 3 --retry-delay 2 --fail --silent --show-error https://kakeibo-f17.pages.dev/ > /tmp/kakeibo-home.html
          grep -qi "<html" /tmp/kakeibo-home.html
