name: Verify bi-hourly HomeFlow Cron without private Study checkout
on:
  push:
    branches: [fix/homeflow-cron-every-two-hours-20261119]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: PTamako/kakebo_jp
          ref: main
          path: .contract-kakeibo
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: PTamako/jp-document-assistant
          ref: main
          path: .contract-document
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Full accessible HomeFlow tests including Cron, Push and Kakeibo-owner checks
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t suites < <(find tests -maxdepth 1 -name '*.test.mjs' ! -name 'document-study-three-real-apps.test.mjs' | sort)
          KAKEBO_CONTRACT_ROOT="$GITHUB_WORKSPACE/.contract-kakeibo" node --test --test-skip-pattern="G0 cross-app CI can locate every Stage F migration in its pinned checkout" "${suites[@]}"
      - name: Typecheck and Vite build
        run: npm run build
      - name: Immutable migration validation
        run: python3 scripts/check_migrations.py
      - name: Synthetic D1 rollback rehearsal only
        run: python3 -m unittest discover -s tests -p 'test_release_local_data_rehearsal.py'
      - name: Validate Wrangler Cron and Worker bundle without deployment
        run: npx wrangler deploy --dry-run --outdir .wrangler/bihourly-cron-dryrun
