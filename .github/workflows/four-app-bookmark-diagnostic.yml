name: Four-app D1 bookmark permission diagnostic
on:
  push:
    branches: [main]
    paths: [.github/workflows/four-app-bookmark-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Identify sanitized Cloudflare Time Travel error
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const ids={
           homeflow:'3e0205b0-77e2-4259-8ac2-4c56efc43f8a',
           kakeibo:'4d790915-fc06-4073-b660-bbb51dc74463',
           study:'ed4ca935-5d00-4f38-b3c5-c0d53c5aad63',
           document:'22a671c0-3f6c-4707-adf1-b24ac95330c6'
          };
          const baseRoot='https://api.cloudflare.com/client/v4/accounts/'+
            encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID);
          const key={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          // Reproduce release order: SELECT-only D1 marker scans, then bookmarks.
          const before=await fetch(baseRoot+'/d1/database/'+ids.kakeibo+
            '/time_travel/bookmark',{headers:key});
          console.log(JSON.stringify({phase:'k_before_scans',http:before.status,
            result_ok:(await before.json()).success===true}));
          for(const [name,id] of Object.entries(ids)){
            const table=name==='kakeibo'?'schema_migrations':'d1_migrations';
            const col=name==='kakeibo'?'version':'name';
            const q=await fetch(baseRoot+'/d1/database/'+id+'/query',{
              method:'POST',headers:{...key,'Content-Type':'application/json'},
              body:JSON.stringify({sql:'SELECT '+col+' FROM '+table+' ORDER BY '+col})});
            const b=await q.json();
            console.log(JSON.stringify({phase:'marker_scan',database:name,http:q.status,
              changed_db:b.result?.[0]?.meta?.changed_db,
              rows_written:b.result?.[0]?.meta?.rows_written}));
          }
          for(const [name,id] of Object.entries(ids)){
           const base='https://api.cloudflare.com/client/v4/accounts/'+
            encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID)+
            '/d1/database/'+id+'/time_travel/bookmark';
           try{
            const r=await fetch(base,{headers:{Authorization:'Bearer '+
             process.env.CLOUDFLARE_API_TOKEN}});
            const b=await r.json();
            const failures=(b.errors||[]).map(e=>({
             code:e.code,
             // Always remove possible account/DB IDs/URLs before printing.
             summary:String(e.message||'').replace(/[a-f0-9]{32}/gi,'[ID]')
              .replace(/[a-f0-9]{8}-(?:[a-f0-9]{4}-){3}[a-f0-9]{12}/gi,'[ID]')
              .replace(/https?:\/\/\S+/gi,'[URL]').slice(0,160)}));
            console.log(JSON.stringify({database:name,http:r.status,
             result_ok:b.success===true,bookmark_present:!!b.result?.bookmark,
             errors:failures,private_values_logged:false}));
           }catch{console.log(JSON.stringify({database:name,transport_failed:true}))}
          }
          const kAt=baseRoot+'/d1/database/'+ids.kakeibo+'/time_travel/bookmark?timestamp='+
            encodeURIComponent(new Date(Date.now()-10000).toISOString());
          const at=await fetch(kAt,{headers:key});
          const atJson=await at.json();
          const safe=(atJson.errors||[]).map(e=>({
           code:e.code,summary:String(e.message||'')
            .replace(/[a-f0-9]{32}/gi,'[ID]').replace(/https?:\\/\\/\\S+/gi,'[URL]').slice(0,120)}));
          console.log(JSON.stringify({phase:'k_timestamp_fallback',http:at.status,
            result_ok:atJson.success===true,bookmark_present:!!atJson.result?.bookmark,
            errors:safe}));
          NODE
