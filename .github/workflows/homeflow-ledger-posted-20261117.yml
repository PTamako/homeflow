name: HomeFlow posted finance ledger approval production one-shot
# Audited household-entry-posting acceptance across card, prepaid and bank flows. No D1 migration, Preview URL, Preview Worker, or financial write.
on:
  push:
    branches: [main]
    paths: [.github/workflows/homeflow-ledger-posted-20261117.yml]
permissions:
  contents: read
concurrency:
  group: four-app-coordinated-production-release
  cancel-in-progress: false
jobs:
  homeflow-ui-production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout Kakeibo audited contract
        uses: actions/checkout@v4
        with:
          repository: PTamako/kakebo_jp
          ref: 3bda802d276f734049fb85d3971c0c29fe731148
          path: .contract-kakeibo
          persist-credentials: false
      - name: Checkout Document Assistant audited contract
        uses: actions/checkout@v4
        with:
          repository: PTamako/jp-document-assistant
          ref: 3289c5ffa8dc472d0bba399ad9672a5bc96c504c
          path: .contract-document
          persist-credentials: false
      - name: Checkout Study audited contract
        uses: actions/checkout@v4
        with:
          repository: PTamako/it-study-platform
          ref: e0255236a10b3dd5a8bdc10b9114d581a7198122
          path: .contract-study
          persist-credentials: false
      - name: Reject unreviewed cross-app main updates
        shell: bash
        run: |
          set -euo pipefail
          while read -r repo pinned; do
            actual="$(git ls-remote "https://github.com/PTamako/${repo}.git" refs/heads/main | cut -f1)"
            [[ -n "${actual}" && "${actual}" == "${pinned}" ]] || {
              echo "::error::PTamako/${repo} changed since integration tests were pinned"
              exit 1
            }
          done <<'REVIEWED'
          kakebo_jp 3bda802d276f734049fb85d3971c0c29fe731148
          jp-document-assistant 3289c5ffa8dc472d0bba399ad9672a5bc96c504c
          it-study-platform e0255236a10b3dd5a8bdc10b9114d581a7198122
          REVIEWED
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify release source, tests and build
        env:
          KAKEBO_CONTRACT_ROOT: ${{ github.workspace }}/.contract-kakeibo
        run: |
          npm ci --no-audit --no-fund
          npm run check
          python3 scripts/check_migrations.py
      - name: Read-only check cross-application production bindings
        run: node scripts/release-g8-binding-preflight.mjs
      - name: Validate one-time deploy helper syntax
        run: node --check scripts/deploy-homeflow-ledger-posted-20261117.mjs
      - name: Capture active production version and bindings without modification
        run: node scripts/deploy-homeflow-ledger-posted-20261117.mjs preflight
      - name: Build assets and stamp installed PWA cache
        run: |
          node scripts/stamp-pwa.mjs "$GITHUB_SHA"
          npm run build
      - name: Stage code and assets as inactive version preserving secrets and vars
        run: npx wrangler versions upload --keep-vars
      - name: Activate HomeFlow only, verify 0060 health and private endpoints, roll back on failure
        run: node scripts/deploy-homeflow-ledger-posted-20261117.mjs activate
