name: One-time HomeFlow reminder-only production release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-reminder-only-20261117.yml'

permissions:
  contents: read

concurrency:
  group: four-app-coordinated-production-release
  cancel-in-progress: false

jobs:
  homeflow-production:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CI: 'true'
    steps:
      - name: Checkout reviewed HomeFlow main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pinned Kakeibo cross-app test fixtures (read-only)
        uses: actions/checkout@v5
        with:
          repository: PTamako/kakebo_jp
          ref: 3b84b7265c7c6940d81132f6378b600f14fe4028
          path: .contract-kakeibo
          persist-credentials: false
      - name: Checkout pinned Document Assistant cross-app test fixtures (read-only)
        uses: actions/checkout@v5
        with:
          repository: PTamako/jp-document-assistant
          ref: cbeda805e6b65b313af9b805e6394538113700be
          path: .contract-document
          persist-credentials: false
      - name: Checkout pinned Study cross-app test fixtures (read-only)
        uses: actions/checkout@v5
        with:
          repository: PTamako/it-study-platform
          ref: dea0a9607a2cde2b66f328696954750748f67f42
          path: .contract-study
          persist-credentials: false
      - name: Require exact audited feature commit and production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          git merge-base --is-ancestor 06f2f91dcd8c178a17f039b69b332b184c980cf9 HEAD
          test "$(git diff --name-only 06f2f91dcd8c178a17f039b69b332b184c980cf9 HEAD | wc -l | xargs)" = 1
          test "$(git diff --name-only 06f2f91dcd8c178a17f039b69b332b184c980cf9 HEAD)" = '.github/workflows/release-reminder-only-20261117.yml'
          test "$(grep -c '0064_reminder_only_no_points.sql' scripts/check_migrations.py)" = 1
          echo 'Exact reviewed code + one-time release workflow verified.'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Re-run all tests, typechecked PWA build and D1 schema rehearsal
        run: |
          npm ci --no-audit --no-fund
          npm run check
          python3 scripts/check_migrations.py
      - name: Verify Cloudflare resource configuration before any production D1 write
        run: node scripts/release-g8-binding-preflight.mjs
      - name: Capture current production D1 Time Travel bookmark
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/3e0205b0-77e2-4259-8ac2-4c56efc43f8a/time_travel/bookmark" |
            node --input-type=module -e '
              import fs from "node:fs";
              let input="";
              for await (const chunk of process.stdin) input+=chunk;
              const response=JSON.parse(input);
              if(!response.success||!response.result?.bookmark) throw Error("D1_RESTORE_BOOKMARK_MISSING");
              fs.writeFileSync(process.env.RUNNER_TEMP+"/homeflow-reminder-only-rollback-bookmark.txt",response.result.bookmark,{mode:0o600});
              console.log("Production D1 recovery bookmark confirmed, stored only on ephemeral runner.");
            '
      - name: Apply pending HomeFlow D1 migrations to existing PRODUCTION database only
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply homeflow --remote
          result="$(npx wrangler d1 execute homeflow --remote --command="SELECT name FROM d1_migrations WHERE name='0064_reminder_only_no_points.sql'")"
          echo "$result"
          grep -q '0064_reminder_only_no_points.sql' <<< "$result"
      - name: Assert zero-point schema and original points trigger retained on production
        shell: bash
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute homeflow --remote --command="SELECT (SELECT COUNT(*) FROM pragma_table_info('tasks') WHERE name='reminder_only') AS task_column, (SELECT COUNT(*) FROM pragma_table_info('routines') WHERE name='reminder_only') AS routine_column, (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name='points_task_completed' AND instr(sql,'NEW.reminder_only=0')>0) AS zero_point_trigger")"
          echo "$result"
          grep -q 'zero_point_trigger' <<< "$result"
          grep -q 'task_column' <<< "$result"
      - name: Stamp iPhone PWA cache and deploy production Worker with ASSETS
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stamp-pwa.mjs "$GITHUB_SHA"
          npm run build
          npx wrangler deploy
      - name: Verify real production API health, database identity and environment
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 3 --fail --silent --show-error             'https://homeflow.yupan6706.workers.dev/api/health' |
            node -e '
              let input="";
              process.stdin.on("data",x=>input+=x);
              process.stdin.on("end",()=>{
                const health=JSON.parse(input);
                if(health.ok!==true||health.environment!=="production"||health.database!=="ready")
                  throw Error("PRODUCTION_HEALTH_NOT_READY:"+JSON.stringify(health));
                console.log("HomeFlow production API healthy, production D1 ready.");
              });
            '
