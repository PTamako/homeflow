name: Deploy HomeFlow
on:
  # Explicit dispatch only; a regular main push must never publish production.
  # No Preview resources are ever created.
  workflow_dispatch:
    inputs:
      release_confirmation:
        description: "After G0/G1/G3-G6/G8/G9, enter FOUR_APP_RELEASE_APPROVED"
        required: true
        type: string

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_confirmation == 'FOUR_APP_RELEASE_APPROVED' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Require production deployment credentials (fail closed)
        shell: bash
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "::error::Cloudflare production credentials missing; deployment aborted"
            exit 1
          fi
      # Reviewed contract counterpart. Update the pinned commit with the
      # cross-app contract whenever the target execution protocol changes.
      - name: Checkout Kakeibo contract counterpart
        uses: actions/checkout@v5
        with:
          repository: PTamako/kakebo_jp
          ref: ee713c85c4912cc7d8b5180bf37c34fc90fd12f7
          path: .contract-kakeibo
          persist-credentials: false
      - name: Checkout Document Assistant execution counterpart
        uses: actions/checkout@v5
        with:
          repository: PTamako/jp-document-assistant
          ref: 3289c5ffa8dc472d0bba399ad9672a5bc96c504c
          path: .contract-document
          persist-credentials: false
      - name: Checkout Study execution counterpart (immutable reviewed SHA)
        uses: actions/checkout@v5
        with:
          repository: PTamako/it-study-platform
          ref: dea0a9607a2cde2b66f328696954750748f67f42
          path: .contract-study
          persist-credentials: false
      # Exact tested source snapshots; protect review by refusing drift.
      - name: Reject stale cross-app main heads before production deploy
        shell: bash
        run: |
          set -euo pipefail
          while read -r repo pinned; do
            latest="$(git ls-remote "https://github.com/PTamako/${repo}.git" refs/heads/main | cut -f1)"
            if [[ -z "${latest}" || "${latest}" != "${pinned}" ]]; then
              echo "::error::PTamako/${repo} main no longer matches reviewed CI contract pin"
              exit 1
            fi
          done <<'REVIEWED_HEADS'
          kakebo_jp ee713c85c4912cc7d8b5180bf37c34fc90fd12f7
          jp-document-assistant 3289c5ffa8dc472d0bba399ad9672a5bc96c504c
          it-study-platform dea0a9607a2cde2b66f328696954750748f67f42
          REVIEWED_HEADS
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Stamp PWA cache with the deployed commit SHA
        run: node scripts/stamp-pwa.mjs "$GITHUB_SHA"
      - name: Run cross-app tests and typechecked build
        env:
          KAKEBO_CONTRACT_ROOT: ${{ github.workspace }}/.contract-kakeibo
        run: npm run check
      - name: Validate complete migration manifest without touching D1
        run: python3 scripts/check_migrations.py
      # Fail before any production Worker deploy if OAuth, Service Bindings,
      # identity, or financial Secrets are missing in the real Cloudflare account.
      # This checks only names and target types; secret values require additional
      # independently signed live verification.
      - name: Require full live G8 production binding preflight
        run: node scripts/release-g8-binding-preflight.mjs
      # The Kakeibo repository does not hold a Cloudflare API token. Publish its
      # exact reviewed main commit using THIS production workflow's existing
      # scoped Cloudflare credentials, to the already-existing Pages project.
      # Explicit --branch=main is production: never create any Preview resources.
      - name: Publish Kakeibo Pages production using reviewed main contract
        working-directory: .contract-kakeibo
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx wrangler pages deploy dist --project-name=kakeibo --branch=main --commit-hash=ee713c85c4912cc7d8b5180bf37c34fc90fd12f7 --commit-message="reviewed ledger-only release"
      # Preview has been permanently decommissioned; deploy only the production Worker.
      - name: Deploy Production
        run: npx wrangler deploy
      - name: Verify Production API / health and database identity
        run: |
          curl --retry 4 --retry-delay 2 --fail --silent --show-error https://homeflow.yupan6706.workers.dev/api/health | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('ok') and d.get('environment')=='production' and d.get('database')=='ready',d"
