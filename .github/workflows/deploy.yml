name: Deploy HomeFlow
on:
  workflow_dispatch:
  push:
    branches: [main]
    # A docs-only commit must never redeploy production.
    # GitHub paths-ignore skips this workflow when ALL changed files match.
    # CI (ci.yml) still validates every push to main and every PR.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      # Workflow policy edits alone must not redeploy the production Worker.
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Stamp PWA cache with the deployed commit SHA
        run: node scripts/stamp-pwa.mjs "$GITHUB_SHA"
      - run: npm run check
      - name: Validate complete migration manifest without touching D1
        run: python3 scripts/check_migrations.py
      # Preview has been permanently decommissioned; deploy only the production Worker.
      - name: Deploy Production
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx wrangler deploy
      - name: Verify Production API / health and database identity
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          curl --retry 4 --retry-delay 2 --fail --silent --show-error https://homeflow.yupan6706.workers.dev/api/health | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('ok') and d.get('environment')=='production' and d.get('database')=='ready',d"
      - name: Note missing deployment authorization
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "Deployment skipped until Cloudflare repository secrets are configured."
