name: One-time HomeFlow audit fixes production release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-audit-homeflow-20261118.yml'
permissions:
  contents: read
concurrency:
  group: four-app-coordinated-production-release
  cancel-in-progress: false
jobs:
  homeflow-production:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CI: 'true'
    steps:
      - name: Checkout auditable current production main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out pinned cross-app contract fixtures without deployment
        uses: actions/checkout@v5
        with:
          repository: PTamako/kakebo_jp
          ref: 3b84b7265c7c6940d81132f6378b600f14fe4028
          path: .contract-kakeibo
          persist-credentials: false
      - name: Check out pinned document and study read-only fixtures
        uses: actions/checkout@v5
        with:
          repository: PTamako/jp-document-assistant
          ref: cbeda805e6b65b313af9b805e6394538113700be
          path: .contract-document
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: PTamako/it-study-platform
          ref: dea0a9607a2cde2b66f328696954750748f67f42
          path: .contract-study
          persist-credentials: false
      - name: Refuse unexpected environment or missing audited migration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          git merge-base --is-ancestor 59055a6df992aed9713d2ccc3002aafc2925dd93 HEAD
          test -f migrations/0065_extend_active_sessions_to_30_days.sql
          grep -Fq '0065_extend_active_sessions_to_30_days.sql' scripts/check_migrations.py
          grep -Fq 'reminder_only,reminder' worker/portable.js
          ! grep -q 'homeflow-preview' wrangler.toml || grep -Fq 'Preview Worker and D1 retired' wrangler.toml
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate all source tests, migration order and PWA types before writes
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run check
          python3 scripts/check_migrations.py
      - name: Require correct existing live production bindings
        run: node scripts/release-g8-binding-preflight.mjs
      - name: Capture a production D1 Time Travel recovery bookmark
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/3e0205b0-77e2-4259-8ac2-4c56efc43f8a/time_travel/bookmark" |
            node --input-type=module -e '
              import fs from "node:fs";
              let data="";
              for await (const chunk of process.stdin) data+=chunk;
              const res=JSON.parse(data);
              if(!res.success||!res.result?.bookmark) throw Error("PRODUCTION_RECOVERY_BOOKMARK_UNAVAILABLE");
              fs.writeFileSync(process.env.RUNNER_TEMP+"/homeflow-audit-recovery-bookmark",res.result.bookmark,{mode:0o600});
              console.log("Production recovery bookmark captured privately.");
            '
      - name: Apply only pending migration 0065 to existing production D1
        shell: bash
        run: |
          set -euo pipefail
          prior="$(npx wrangler d1 execute homeflow --remote --command="SELECT COUNT(*) AS applied FROM d1_migrations WHERE name='0065_extend_active_sessions_to_30_days.sql'")"
          echo "$prior"
          npx wrangler d1 migrations apply homeflow --remote
          after="$(npx wrangler d1 execute homeflow --remote --command="SELECT name FROM d1_migrations WHERE name='0065_extend_active_sessions_to_30_days.sql'")"
          echo "$after"
          grep -q '0065_extend_active_sessions_to_30_days.sql' <<< "$after"
      - name: Stamp cache and deploy HomeFlow Worker plus static PWA only
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stamp-pwa.mjs "$GITHUB_SHA"
          npm run build
          npx wrangler deploy
      - name: Verify the live production health endpoint and D1 identity
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 3 --fail --silent --show-error \
            'https://homeflow.yupan6706.workers.dev/api/health' |
            node -e '
              let s="";process.stdin.on("data",c=>s+=c);
              process.stdin.on("end",()=>{
                const d=JSON.parse(s);
                if(d.ok!==true||d.environment!=="production"||d.database!=="ready")
                  throw Error("PRODUCTION_HEALTH_NOT_READY");
                console.log("HomeFlow production Worker and D1 ready.");
              });
            '
