name: One-time HomeFlow ledger approval hardening production
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-homeflow-approval-hardening-production.yml'

permissions:
  contents: read

concurrency:
  group: deploy-homeflow-production
  cancel-in-progress: false

jobs:
  deploy-production:
    if: "${{ startsWith(github.event.head_commit.message, 'deploy(homeflow): approval hardening') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check credentials and strictly production-only configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          grep -q '^name = "homeflow"$' wrangler.toml
          grep -q '^preview_urls = false$' wrangler.toml
          grep -q '^OWNER_REVIEW_SCOPE_MODE = "household_ledger_only"$' wrangler.toml
          test -f migrations/0062_dismissed_applied_approval_history.sql
          test -f migrations/0063_expand_applied_ledger_approval_dismissal.sql
          grep -q "household_approval_dismissed_history" worker/approvals.js
          grep -q "dismissHistory(row)" src/components/FamilyApprovalFeed.vue
          grep -q "backup-heading + .backup-section" src/components/BackupPanel.vue
      - name: Checkout reviewed Kakeibo counterpart for regression tests (not deployed)
        uses: actions/checkout@v4
        with:
          repository: PTamako/kakebo_jp
          ref: ee713c85c4912cc7d8b5180bf37c34fc90fd12f7
          path: .contract-kakeibo
          persist-credentials: false
      - name: Checkout reviewed Document Assistant counterpart (not deployed)
        uses: actions/checkout@v4
        with:
          repository: PTamako/jp-document-assistant
          ref: 3289c5ffa8dc472d0bba399ad9672a5bc96c504c
          path: .contract-document
          persist-credentials: false
      - name: Checkout reviewed Study counterpart (not deployed)
        uses: actions/checkout@v4
        with:
          repository: PTamako/it-study-platform
          ref: dea0a9607a2cde2b66f328696954750748f67f42
          path: .contract-study
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Stamp HomeFlow PWA cache with production release commit
        run: node scripts/stamp-pwa.mjs "$GITHUB_SHA"
      - name: Run full HomeFlow tests and typechecked build
        env:
          KAKEBO_CONTRACT_ROOT: ${{ github.workspace }}/.contract-kakeibo
        run: npm run check
      - name: Verify the complete local D1 migration manifest
        run: python3 scripts/check_migrations.py
      - name: Verify live D1 has the additive 0062 migration before changing code
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://api.cloudflare.com/client/v4/accounts/' +
            process.env.CLOUDFLARE_ACCOUNT_ID +
            '/d1/database/3e0205b0-77e2-4259-8ac2-4c56efc43f8a/query';
          const sql = "SELECT " +
            "(SELECT COUNT(*) FROM d1_migrations WHERE name='0061_hidden_deleted_shared_approval_history.sql') AS marker61, " +
            "(SELECT COUNT(*) FROM d1_migrations WHERE name='0062_dismissed_applied_approval_history.sql') AS migration_marker, " +
            "(SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='household_approval_dismissed_history') AS table_ready, " +
            "(SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name LIKE 'trg_dismissed_approval_%') AS trigger_count";
          const response = await fetch(url, {
            method: 'POST',
            headers: {
              Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN,
              'content-type': 'application/json'
            },
            body: JSON.stringify({sql})
          });
          const value = await response.json();
          const row = value?.result?.[0]?.results?.[0];
          if (!response.ok || !value?.success || row?.migration_marker !== 1 ||
              row?.table_ready !== 1 || row?.trigger_count !== 3 || row?.marker61 !== 1) {
            throw Error('Production D1 approval dismissal migration is not ready');
          }
          console.log('HomeFlow production D1 migration 0062 verified');
          NODE
      - name: Verify existing production bindings and secrets (read-only)
        run: node scripts/release-g8-binding-preflight.mjs
      - name: Apply only pending additive migrations to production HomeFlow D1
        run: npx wrangler d1 migrations apply homeflow --remote --yes
      - name: Verify 0063 migration and updated owner-only dismissal trigger
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://api.cloudflare.com/client/v4/accounts/' +
            process.env.CLOUDFLARE_ACCOUNT_ID +
            '/d1/database/3e0205b0-77e2-4259-8ac2-4c56efc43f8a/query';
          const sql = "SELECT " +
            "(SELECT COUNT(*) FROM d1_migrations WHERE name='0063_expand_applied_ledger_approval_dismissal.sql') AS migration_marker, " +
            "(SELECT sql FROM sqlite_master WHERE type='trigger' AND name='trg_dismissed_approval_owner_applied') AS guard_sql";
          const response = await fetch(url, {
            method:'POST',headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,
              'content-type':'application/json'},body:JSON.stringify({sql})
          });
          const data=await response.json(),r=data?.result?.[0]?.results?.[0];
          if(!response.ok||!data?.success||r?.migration_marker!==1||
             !r?.guard_sql?.includes("a.operation='document.sync.finance'")||
             !r?.guard_sql?.includes("a.operation='finance.credit_card.purchase'"))
            throw Error('Production D1 0063 dismissal guard not verified');
          console.log('Production dismissal trigger 0063 verified');
          NODE
      - name: Deploy ONLY HomeFlow production Worker and its built PWA assets
        run: npx wrangler deploy
      - name: Confirm HomeFlow production health
        run: |
          curl --retry 5 --retry-delay 3 --fail --silent --show-error \
            https://homeflow.yupan6706.workers.dev/api/health | \
            python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('ok') and d.get('environment')=='production' and d.get('database')=='ready',d"
