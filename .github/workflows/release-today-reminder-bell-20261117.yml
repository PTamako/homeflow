name: One-time HomeFlow Today bell production release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-today-reminder-bell-20261117.yml'

permissions:
  contents: read

concurrency:
  group: four-app-coordinated-production-release
  cancel-in-progress: false

jobs:
  homeflow-production:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CI: 'true'
    steps:
      - name: Checkout reviewed HomeFlow main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pinned Kakeibo cross-app tests (read-only)
        uses: actions/checkout@v5
        with:
          repository: PTamako/kakebo_jp
          ref: 3b84b7265c7c6940d81132f6378b600f14fe4028
          path: .contract-kakeibo
          persist-credentials: false
      - name: Checkout pinned Document Assistant cross-app tests (read-only)
        uses: actions/checkout@v5
        with:
          repository: PTamako/jp-document-assistant
          ref: cbeda805e6b65b313af9b805e6394538113700be
          path: .contract-document
          persist-credentials: false
      - name: Checkout pinned Study cross-app tests (read-only)
        uses: actions/checkout@v5
        with:
          repository: PTamako/it-study-platform
          ref: dea0a9607a2cde2b66f328696954750748f67f42
          path: .contract-study
          persist-credentials: false
      - name: Require exact reviewed main and valid production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          git merge-base --is-ancestor b52fafda83f60fb4483c08b2dd09aa5eae17bfd5 HEAD
          test "$(git diff --name-only b52fafda83f60fb4483c08b2dd09aa5eae17bfd5 HEAD)" = '.github/workflows/release-today-reminder-bell-20261117.yml'
          grep -Fq 'reminderOnly=row=>row.task?.reminderOnly' worker/today-page.js
          grep -Fq 'scheduleJstMidnightRefresh()' src/App.vue
          echo "Exact reviewed HomeFlow reminder-bell source verified."
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Test and typecheck HomeFlow plus existing D1 migration manifest
        run: |
          npm ci --no-audit --no-fund
          npm run check
          python3 scripts/check_migrations.py
      - name: Verify existing Cloudflare production bindings without editing other apps
        run: node scripts/release-g8-binding-preflight.mjs
      - name: Verify preexisting reminder-only D1 schema read-only
        shell: bash
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute homeflow --remote --command="SELECT (SELECT COUNT(*) FROM d1_migrations WHERE name='0064_reminder_only_no_points.sql') AS migration_applied, (SELECT COUNT(*) FROM pragma_table_info('tasks') WHERE name='reminder_only') AS task_column, (SELECT COUNT(*) FROM pragma_table_info('routines') WHERE name='reminder_only') AS routine_column")"
          echo "$result"
          grep -q 'migration_applied' <<< "$result"
          grep -q 'task_column' <<< "$result"
          grep -q 'routine_column' <<< "$result"
      - name: Publish reviewed production HomeFlow Worker and PWA only
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stamp-pwa.mjs "$GITHUB_SHA"
          npm run build
          npx wrangler deploy
      - name: Verify production API and homeflow database health
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 3 --fail --silent --show-error             'https://homeflow.yupan6706.workers.dev/api/health' |
            node -e '
              let input="";
              process.stdin.on("data",x=>input+=x);
              process.stdin.on("end",()=>{
                const health=JSON.parse(input);
                if(health.ok!==true||health.environment!=="production"||health.database!=="ready")
                  throw Error("PRODUCTION_HEALTH_NOT_READY:"+JSON.stringify(health));
                console.log("HomeFlow production: healthy.");
              });
            '
