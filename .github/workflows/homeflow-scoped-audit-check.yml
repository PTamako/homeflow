name: HomeFlow scoped audit validation (private Study checkout unavailable)
on:
  push:
    branches: [fix/homeflow-production-audit-20261119]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Checkout Kakeibo counterpart
        uses: actions/checkout@v5
        with:
          repository: PTamako/kakebo_jp
          ref: main
          path: .contract-kakeibo
          persist-credentials: false
      - name: Checkout Document Assistant counterpart
        uses: actions/checkout@v5
        with:
          repository: PTamako/jp-document-assistant
          ref: main
          path: .contract-document
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Run all HomeFlow and accessible cross-app tests; exclude private Study-dependent fixture only
        shell: bash
        env:
          KAKEBO_CONTRACT_ROOT: ${{ github.workspace }}/.contract-kakeibo
        run: |
          set -euo pipefail
          mapfile -t suites < <(find tests -maxdepth 1 -name '*.test.mjs' ! -name 'document-study-three-real-apps.test.mjs' | sort)
          echo "Running ${#suites[@]} test suites; private Study test requires a cross-repository token not available in this job"
          node --test "${suites[@]}"
      - name: Check type safety and production asset build
        run: npm run build
      - name: Verify local migration manifest and SQL schema
        run: python3 scripts/check_migrations.py
      - name: Verify local SQLite migration rollback rehearsal
        run: python3 -m unittest discover -s tests -p 'test_release_local_data_rehearsal.py'
      - name: Verify Worker package without deploying
        run: npx wrangler deploy --dry-run --outdir .wrangler/dryrun
