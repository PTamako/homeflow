name: HomeFlow management UI one-time production hotfix
on:
  push:
    branches: [main]
    paths: [.github/workflows/homeflow-ui-hotfix-20261116.yml]
permissions:
  contents: read
concurrency:
  group: four-app-coordinated-production-release
  cancel-in-progress: false
jobs:
  homeflow-ui-production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify release source, tests and build
        run: |
          npm ci --no-audit --no-fund
          npm run check
          python3 scripts/check_migrations.py
      - name: Read-only check cross-application production bindings
        run: node scripts/release-g8-binding-preflight.mjs
      - name: Capture active production version and bindings without modification
        run: node scripts/deploy-homeflow-ui-hotfix.mjs preflight
      - name: Build assets and stamp installed PWA cache
        run: |
          node scripts/stamp-pwa.mjs "$GITHUB_SHA"
          npm run build
      - name: Stage code and assets as inactive version preserving secrets and vars
        run: npx wrangler versions upload --keep-vars
      - name: Activate HomeFlow only, smoke test and roll back on failure
        run: node scripts/deploy-homeflow-ui-hotfix.mjs activate
