name: One-time HomeFlow Approval Detail UI Production
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-homeflow-approval-detail-ui-production.yml'
permissions:
  contents: read
concurrency:
  group: deploy-homeflow-production
  cancel-in-progress: false
jobs:
  publish:
    if: "${{ github.event.head_commit.message == 'deploy(homeflow): publish approval detail bottom sheet UI' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Require existing production credentials only
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Production credential unavailable"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Account unavailable"; exit 1; }
          grep -q 'preview_urls = false' wrangler.toml
          grep -q 'OWNER_REVIEW_SCOPE_MODE = "household_ledger_only"' wrangler.toml
      - name: Checkout reviewed Kakeibo contract for the full test suite
        uses: actions/checkout@v4
        with:
          repository: PTamako/kakebo_jp
          ref: 2a4374bea91865a984444fb95e05928399e1d0f8
          path: .contract-kakeibo
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Confirm exact compact detail and bottom sheet changes
        run: |
          test -f tests/family-approval-bottom-sheet.test.mjs
          grep -q 'class="feed-text-button feed-detail-trigger"' src/components/FamilyApprovalFeed.vue
          grep -q '<EditBottomSheet v-if="detailSheetRow"' src/components/FamilyApprovalFeed.vue
      - name: Stamp production PWA cache with the deploy commit
        run: node scripts/stamp-pwa.mjs "$GITHUB_SHA"
      - name: Run full regression tests and typechecked production build
        env:
          KAKEBO_CONTRACT_ROOT: ${{ github.workspace }}/.contract-kakeibo
        run: npm run check
      - name: Check migrations without touching production D1
        run: python3 scripts/check_migrations.py
      - name: Verify production bindings read-only
        run: node scripts/release-g8-binding-preflight.mjs
      - name: Deploy only the existing HomeFlow production Worker and PWA assets
        run: npx wrangler deploy
      - name: Check production health
        run: |
          curl --retry 5 --retry-delay 3 --fail --silent --show-error https://homeflow.yupan6706.workers.dev/api/health | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('ok') and d.get('environment')=='production' and d.get('database')=='ready',d"
