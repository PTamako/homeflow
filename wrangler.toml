name = "homeflow"
main = "worker/index.js"
compatibility_date = "2026-10-01"
# Cloudflare-to-Cloudflare HTTPS calls (HomeFlow -> Pages kakeibo API) use the
# public route instead of the same-zone Worker routing restriction (1042).
# Do not change the read-only ledger URL or expose the ledger token.
compatibility_flags = ["global_fetch_strictly_public"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[triggers]
crons = ["0 23 * * *"] # Daily 08:00 Asia/Tokyo

[vars]
APP_ENV = "production"
KAKEBO_LEDGER_API_URL = "https://kakeibo-f17.pages.dev/api/homeflow-ledger"

[[d1_databases]]
binding = "DB"
database_name = "homeflow"
database_id = "3e0205b0-77e2-4259-8ac2-4c56efc43f8a"
migrations_dir = "migrations"

[env.preview]
name = "homeflow-preview"

[env.preview.triggers]
crons = []

[env.preview.vars]
APP_ENV = "preview"

[env.preview.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "homeflow-preview"
database_id = "da6d49ab-ae80-4bb0-a2d0-18379ebc7d92"
migrations_dir = "migrations"
