name = "homeflow"
main = "worker/index.js"
compatibility_date = "2026-10-01"
# Keep production workers.dev active, but never expose version/preview URLs.
preview_urls = false
# Cloudflare-to-Cloudflare HTTPS calls (HomeFlow -> Pages kakeibo API) use the
# public route instead of the same-zone Worker routing restriction (1042).
# Do not change the read-only ledger URL or expose the ledger token.
compatibility_flags = ["global_fetch_strictly_public"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Private bucket: no public domain, no r2.dev access, objects only through session-authenticated Worker.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "homeflow-family-media"

[triggers]
crons = ["0 1-13/2,21,23 * * *"] # Nine UTC fires daily = JST 06:00/08:00/.../22:00, no overnight no-ops

[vars]
OAUTH_ENABLED = "true"
APPROVALS_ENABLED = "true"
# Enforced at submission, review, batch review, feeds and execution.
OWNER_REVIEW_SCOPE_MODE = "household_ledger_only"
APPROVAL_EXECUTION_ENABLED = "true"
APPROVAL_VERIFICATION_ENABLED = "true"
SHARED_ENTRY_APPROVAL_EXECUTION_ENABLED = "true"
BANK_TRANSFER_APPROVAL_EXECUTION_ENABLED = "false"
CARD_APPROVAL_EXECUTION_ENABLED = "true"
CARD_SETTLEMENT_APPROVAL_EXECUTION_ENABLED = "false"
POINTS_APPROVAL_EXECUTION_ENABLED = "false"
PREPAID_APPROVAL_EXECUTION_ENABLED = "true"
SBI_CASH_APPROVAL_EXECUTION_ENABLED = "false"
DOCUMENT_EXECUTION_ENABLED = "true"
DOCUMENT_STUDY_EXECUTION_ENABLED = "true"
DOCUMENT_TASK_EXECUTION_ENABLED = "true"
APPROVAL_SUBMISSION_ENABLED = "true"
APPROVAL_BATCH_REVIEW_ENABLED = "true"
BANK_TRANSFER_APPROVAL_SUBMISSION_ENABLED = "false"
CARD_APPROVAL_SUBMISSION_ENABLED = "true"
CARD_SETTLEMENT_APPROVAL_SUBMISSION_ENABLED = "false"
POINTS_APPROVAL_SUBMISSION_ENABLED = "false"
PREPAID_APPROVAL_SUBMISSION_ENABLED = "true"
SBI_CASH_APPROVAL_SUBMISSION_ENABLED = "false"
DOCUMENT_APPROVAL_SUBMISSION_ENABLED = "true"
CROSS_MEMBER_TRANSFER_CONSENTS_ENABLED = "false"
CROSS_MEMBER_TRANSFER_PROOF_ENABLED = "true"
RECURRING_FINANCE_AUTH_ENABLED = "true"
RECURRING_FINANCE_RESERVATIONS_ENABLED = "true"
SHARED_ENTRY_APPROVAL_SUBMISSION_ENABLED = "true"
RECURRING_FINANCE_POLICY_SUBMISSION_ENABLED = "true"
RECURRING_FINANCE_EXECUTION_PROOF_ENABLED = "true"

APP_ENV = "production"
KAKEBO_LEDGER_API_URL = "https://kakeibo-f17.pages.dev/api/homeflow-ledger"
# Exact production-only OAuth callback allowlist; no wildcard or Preview origins.
OAUTH_CLIENT_REDIRECTS = '{"kakeibo":["https://kakeibo-f17.pages.dev/api/homeflow-sso/callback"],"it-study-platform":["https://it-study-platform.yupan6706.workers.dev/api/homeflow-sso/callback"],"jp-document-assistant":["https://jp-document-assistant.yupan6706.workers.dev/api/homeflow-sso/callback"]}'

# Internal-only read-only ledger Worker; production only, not bound in Preview.
# kakeibo D1 remains bound to the isolated target Worker, not HomeFlow.
[[services]]
binding = "KAKEBO_LEDGER_SERVICE"
service = "kakeibo-homeflow-bridge"

[[d1_databases]]
binding = "DB"
database_name = "homeflow"
database_id = "3e0205b0-77e2-4259-8ac2-4c56efc43f8a"
migrations_dir = "migrations"

# Signed financial executors all target the EXISTING internal-only Kakeibo
# Worker (workers_dev=false; no public route). It delegates to existing
# approved Pages handlers, using the SAME Kakeibo D1 and HomeFlow proof.
[[services]]
binding = "KAKEIBO_EXECUTION_SERVICE"
service = "kakeibo-homeflow-bridge"

[[services]]
binding = "KAKEIBO_BANK_TRANSFER_EXECUTION_SERVICE"
service = "kakeibo-homeflow-bridge"

[[services]]
binding = "KAKEIBO_CARD_EXECUTION_SERVICE"
service = "kakeibo-homeflow-bridge"

[[services]]
binding = "KAKEIBO_CARD_SETTLEMENT_EXECUTION_SERVICE"
service = "kakeibo-homeflow-bridge"

[[services]]
binding = "KAKEIBO_POINTS_EXECUTION_SERVICE"
service = "kakeibo-homeflow-bridge"

[[services]]
binding = "KAKEIBO_PREPAID_EXECUTION_SERVICE"
service = "kakeibo-homeflow-bridge"

[[services]]
binding = "KAKEIBO_SBI_CASH_EXECUTION_SERVICE"
service = "kakeibo-homeflow-bridge"

[[services]]
binding = "KAKEIBO_SHARED_ENTRY_EXECUTION_SERVICE"
service = "kakeibo-homeflow-bridge"

[[services]]
binding = "KAKEIBO_RECURRING_RECEIPT_SERVICE"
service = "kakeibo-homeflow-bridge"

# Both actions and study sync execute in the EXISTING private document Worker.
[[services]]
binding = "DOCUMENT_EXECUTION_SERVICE"
service = "jp-document-assistant"

[[services]]
binding = "DOCUMENT_STUDY_EXECUTION_SERVICE"
service = "jp-document-assistant"

# Preview Worker and D1 retired on 2026-11-12. Production is the only remote environment.
