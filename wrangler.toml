name = "homeflow"
main = "worker/index.js"
compatibility_date = "2026-10-01"
# Cloudflare-to-Cloudflare HTTPS calls (HomeFlow -> Pages kakeibo API) use the
# public route instead of the same-zone Worker routing restriction (1042).
# Do not change the read-only ledger URL or expose the ledger token.
compatibility_flags = ["global_fetch_strictly_public"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Private bucket: no public domain, no r2.dev access, objects only through session-authenticated Worker.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "homeflow-family-media"

[triggers]
crons = ["0 * * * *"] # One free-tier trigger: hourly; daily at 06:00 JST, quiet-hour catch-up through 23:00 JST

[vars]
APP_ENV = "production"
KAKEBO_LEDGER_API_URL = "https://kakeibo-f17.pages.dev/api/homeflow-ledger"

# Internal-only read-only ledger Worker; production only, not bound in Preview.
# kakeibo D1 remains bound to the isolated target Worker, not HomeFlow.
[[services]]
binding = "KAKEBO_LEDGER_SERVICE"
service = "kakeibo-homeflow-bridge"

[[d1_databases]]
binding = "DB"
database_name = "homeflow"
database_id = "3e0205b0-77e2-4259-8ac2-4c56efc43f8a"
migrations_dir = "migrations"

[env.preview]
name = "homeflow-preview"

[env.preview.triggers]
crons = []

[env.preview.vars]
APP_ENV = "preview"

[env.preview.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "homeflow-preview"
database_id = "da6d49ab-ae80-4bb0-a2d0-18379ebc7d92"
migrations_dir = "migrations"
